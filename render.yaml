databases:
  - name: eduportal-db
    databaseName: eduportal
    user: eduportal
    plan: free

services:
  - type: web
    name: eduportal-api
    runtime: python
    rootDir: eduportal_backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.bootstrap_admin && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduportal-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

name: eduportal_app
description: EduPortal - A comprehensive educational platform for admins, teachers, and students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  dio: ^5.4.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.0.0
  file_picker: ^13.0.0
  open_filex: ^4.3.4
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  animate_do: ^3.3.4
  intl: ^0.19.0
  image_picker: ^1.0.7
  uuid: ^4.3.3
  equatable: ^2.0.5
  url_launcher: ^6.2.6
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
